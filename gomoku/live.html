<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gomoku live</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2b3038; --ink: #d8dee9;
    --dim: #8b95a5; --black: #101216; --white: #e8ecf1;
    --ok: #7fb069; --bad: #d16666; --warn: #d7a55b; --accent: #6aa3d5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line);
           display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .muted { color: var(--dim); }
  .wrap { display: grid; grid-template-columns: auto 1fr; gap: 16px; padding: 16px;
          align-items: start; }
  /* board */
  .board { display: inline-grid; gap: 1px; background: var(--line);
           border: 1px solid var(--line); }
  .cell { width: 30px; height: 30px; background: #232830; display: grid;
          place-items: center; font-size: 15px; position: relative; }
  .cell.black::after, .cell.white::after {
    content: ""; width: 22px; height: 22px; border-radius: 50%; }
  .cell.black::after { background: var(--black); box-shadow: inset 0 0 0 1px #3a3f48; }
  .cell.white::after { background: var(--white); }
  .cell.last { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
  .coords { color: var(--dim); font-size: 11px; display: grid; place-items: center; }
  /* replay controls */
  .controls { display: flex; gap: 6px; align-items: center; margin: 10px 0 0; }
  .controls button { background: #232830; color: var(--ink); border: 1px solid var(--line);
                     border-radius: 4px; padding: 3px 9px; cursor: pointer;
                     font: inherit; font-size: 13px; }
  .controls button:hover:not(:disabled) { background: #2b3139; }
  .controls button:disabled { opacity: .4; cursor: default; }
  .controls .spacer { flex: 1; }
  .controls .live { border-color: var(--accent); color: var(--accent); }
  input[type=range] { width: 100%; margin: 8px 0 0; accent-color: var(--accent); }
  /* right panel */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
           overflow: hidden; }
  .panel h2 { font-size: 12px; margin: 0; padding: 8px 12px; color: var(--dim);
              border-bottom: 1px solid var(--line); text-transform: uppercase;
              letter-spacing: .08em; }
  .moves { max-height: 46vh; overflow-y: auto; }
  .move { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
          display: flex; gap: 10px; align-items: baseline; }
  .move:hover { background: #22262e; }
  .move.sel { background: #262c36; }
  .move .no { color: var(--dim); min-width: 28px; text-align: right; }
  .move .who { min-width: 130px; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .move .pt { font-weight: 600; min-width: 42px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
  .tag.ok { background: #263524; color: var(--ok); }
  .tag.bad { background: #3a2626; color: var(--bad); }
  .tag.warn { background: #3a3324; color: var(--warn); }
  .detail { padding: 10px 12px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-bottom: 8px; }
  .kv div:nth-child(odd) { color: var(--dim); }
  pre { margin: 0; padding: 10px; background: #12141a; border: 1px solid var(--line);
        border-radius: 4px; max-height: 26vh; overflow: auto; white-space: pre-wrap;
        word-break: break-word; font-size: 12.5px; }
  .stack { display: grid; gap: 12px; }
  .think { color: var(--warn); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1>gomoku live</h1>
  <span id="players" class="muted"></span>
  <span id="status"></span>
  <span id="conn" class="muted"></span>
</header>

<div class="wrap">
  <div>
    <div id="board" class="board"></div>
    <input type="range" id="scrub" min="0" max="0" value="0" step="1"
           aria-label="move number">
    <div class="controls">
      <button id="first" title="first move">&laquo;</button>
      <button id="prev" title="previous move (left arrow)">&lsaquo;</button>
      <button id="next" title="next move (right arrow)">&rsaquo;</button>
      <button id="last" title="latest move">&raquo;</button>
      <span class="spacer"></span>
      <button id="golive" class="live" title="follow the game as it is played">Live</button>
    </div>
    <p class="muted" id="boardnote" style="margin:8px 0 0"></p>
  </div>

  <div class="stack">
    <div class="panel">
      <h2>Moves &middot; click a row for the raw reply</h2>
      <div id="moves" class="moves"></div>
    </div>
    <div class="panel">
      <h2 id="detailhead">Raw reply</h2>
      <div id="detail" class="detail muted">Waiting for the first move&hellip;</div>
    </div>
    <div class="panel">
      <h2>Metrics</h2>
      <div id="summary" class="detail muted">Available when the game ends</div>
    </div>
  </div>
</div>

<script>
// The engine's own verdict for a move. Keys are the labels gomoku/live.py emits;
// a test asserts every one of them appears in this file.
const LABEL = {
  took_win: ["ok", "won with five"],
  missed_win: ["bad", "missed a win"],
  blocked_five: ["ok", "blocked the four"],
  missed_five_block: ["bad", "failed to block"],
  took_open_four: ["ok", "made an open four"],
  missed_open_four: ["bad", "missed an open four"],
  prevented_open_four: ["ok", "stopped an open four"],
  allowed_open_four: ["bad", "allowed an open four"],
  unavoidable_loss: ["warn", "already lost"],
};
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const EMBEDDED = null; // __EMBEDDED__
let version = -1, state = null;
//: which ply is on screen; null means "follow the live game"
let selected = null;

const at = s => selected === null ? s.moves.length - 1 : selected;

/* ------------------------------------------------------------------ geometry */
function fromNotation(text, size) {
  const col = LETTERS.indexOf(text[0]);
  const row = size - parseInt(text.slice(1), 10);
  return [row, col];
}

// Replay the move list rather than trusting state.board, which is always the
// latest position. Moves with no coordinate (a player that never answered) are
// skipped, so the reconstruction stays aligned with what the referee recorded.
function positionAt(s, upto) {
  const n = s.board.length;
  if (selected === null || upto >= s.moves.length - 1) {
    return { grid: s.board, last: s.last_move };
  }
  const grid = Array.from({ length: n }, () => Array(n).fill(""));
  let last = null;
  for (let i = 0; i <= upto; i++) {
    const m = s.moves[i];
    if (!m.move) continue;
    const [r, c] = fromNotation(m.move, n);
    if (r >= 0 && r < n && c >= 0 && c < n) { grid[r][c] = m.symbol; last = m.move; }
  }
  return { grid, last };
}

/* --------------------------------------------------------------------- board */
function cell(sym, isLast) {
  const d = document.createElement("div");
  d.className = "cell" + (sym === "X" ? " black" : sym === "O" ? " white" : "") +
                (isLast ? " last" : "");
  return d;
}

function drawBoard(s) {
  const { grid, last } = positionAt(s, at(s));
  const n = s.board.length, host = document.getElementById("board");
  host.style.gridTemplateColumns = `repeat(${n + 1}, auto)`;
  host.innerHTML = "";
  const corner = document.createElement("div"); corner.className = "coords";
  host.appendChild(corner);
  for (let c = 0; c < n; c++) {
    const d = document.createElement("div"); d.className = "coords";
    d.textContent = LETTERS[c]; host.appendChild(d);
  }
  for (let r = 0; r < n; r++) {
    const lab = document.createElement("div"); lab.className = "coords";
    lab.textContent = n - r; host.appendChild(lab);
    for (let c = 0; c < n; c++) {
      const coord = LETTERS[c] + (n - r);
      host.appendChild(cell(grid[r][c], coord === last));
    }
  }
  drawControls(s, last);
}

function drawControls(s, last) {
  const total = s.moves.length, i = at(s);
  const scrub = document.getElementById("scrub");
  scrub.max = Math.max(total - 1, 0);
  scrub.value = Math.max(i, 0);
  scrub.disabled = total === 0;
  document.getElementById("first").disabled = total === 0 || i <= 0;
  document.getElementById("prev").disabled = total === 0 || i <= 0;
  document.getElementById("next").disabled = total === 0 || i >= total - 1;
  document.getElementById("last").disabled = total === 0 || i >= total - 1;
  const live = document.getElementById("golive");
  live.disabled = selected === null;
  const note = document.getElementById("boardnote");
  if (!total) { note.textContent = ""; return; }
  note.textContent = selected === null
    ? (last ? `Move ${total} of ${total} (live) \u00b7 last played ${last}` : "")
    : `Move ${i + 1} of ${total} \u00b7 ${last ? "last played " + last : "empty board"}` +
      " \u00b7 arrow keys to step, Live to follow again";
}

/* --------------------------------------------------------------------- moves */
function drawMoves(s) {
  const host = document.getElementById("moves");
  const i = at(s);
  host.innerHTML = "";
  s.moves.forEach((m, k) => {
    const row = document.createElement("div");
    row.className = "move" + (k === i ? " sel" : "");
    const rejected = m.attempts.filter(a => a.verdict !== "accepted").length;
    const tag = LABEL[m.verdict];
    row.innerHTML =
      `<span class="no">${m.ply}.</span>` +
      `<span class="pt">${m.symbol} ${m.move ?? "\u2014"}</span>` +
      `<span class="who muted">${escapeHtml(m.player)}</span>` +
      `<span class="muted">${m.latency_s}s</span>` +
      (rejected ? `<span class="tag bad">${rejected} rejected</span>` : "") +
      (tag ? `<span class="tag ${tag[0]}">${tag[1]}</span>` : "");
    row.onclick = () => select(k);
    host.appendChild(row);
  });
  if (s.thinking) {
    const row = document.createElement("div");
    row.className = "move think";
    row.innerHTML = `<span class="no">\u2026</span>` +
                    `<span>${escapeHtml(s.thinking.player)} is thinking</span>`;
    host.appendChild(row);
  }
  if (selected === null) host.scrollTop = host.scrollHeight;
}

/* -------------------------------------------------------------------- detail */
function drawDetail(s) {
  const host = document.getElementById("detail");
  const m = s.moves[at(s)];
  if (!m) { host.className = "detail muted";
            host.textContent = "Waiting for the first move\u2026"; return; }
  document.getElementById("detailhead").textContent =
    `Move ${m.ply} \u00b7 ${m.player} \u00b7 ${m.move ?? "no move"}`;
  const parts = [];
  m.attempts.forEach(a => {
    const meta = a.meta || {};
    const kv = [];
    const push = (label, value) => {
      if (value !== undefined && value !== null && value !== "")
        kv.push(`<div>${label}</div><div>${value}</div>`);
    };
    push("verdict", a.verdict === "accepted" ? "accepted" : `rejected (${a.error})`);
    push("played", a.move);
    push("latency", a.latency_s + " s");
    if (meta.usage) push("tokens", `in ${meta.usage.input_tokens} / out ${meta.usage.output_tokens}`);
    push("confidence", meta.confidence);
    push("candidates", meta.candidates);
    push("model", meta.jev_model || meta.api_model);
    push("finish_reason", meta.finish_reason);
    if (meta.truncated) push("truncated", "yes");
    if (meta.truncation_retry) push("retried after truncation", "yes");
    if (meta.forced) push("forced", "only one legal point, no API call");
    if (meta.top_probabilities)
      push("top probabilities", Object.entries(meta.top_probabilities)
        .map(([k, v]) => `${k} ${v}`).join(", "));
    if (meta.menu) push("menu", meta.menu.join(" "));
    parts.push(
      `<div class="kv">${kv.join("")}</div>` +
      (a.raw ? `<pre>${escapeHtml(a.raw)}</pre>` : `<p class="muted">(no raw text)</p>`)
    );
  });
  if (m.analysis) {
    const a = m.analysis;
    const facts = [
      ["my winning points", a.own_wins], ["their winning points", a.opponent_wins],
      ["open fours I could make", a.own_open_fours],
      ["open fours they could make", a.opponent_open_fours],
    ].filter(([, v]) => v && v.length)
     .map(([k, v]) => `<div>${k}</div><div>${v.join(" ")}</div>`).join("");
    if (facts) parts.push(`<h2 style="padding:0;border:0">Engine facts (computed before asking)</h2>
                           <div class="kv">${facts}</div>`);
  }
  host.className = "detail";
  host.innerHTML = parts.join("<hr style='border:0;border-top:1px solid var(--line);margin:10px 0'>");
}

/* ------------------------------------------------------------------- metrics */
function drawSummary(s) {
  const host = document.getElementById("summary");
  if (!s.summary) { host.className = "detail muted";
                    host.textContent = "Available when the game ends"; return; }
  const cols = [
    ["player", p => escapeHtml(p.name)], ["W", p => p.wins], ["L", p => p.losses],
    ["moves", p => p.moves], ["winconv", p => pct(p.win_conversion)],
    ["block%", p => pct(p.block_rate)], ["of.make", p => pct(p.open_four_conversion)],
    ["of.stop", p => pct(p.open_four_prevention)], ["lat s", p => p.avg_latency_s ?? "\u2014"],
  ];
  const rows = Object.values(s.summary.players).map(p =>
    `<tr>${cols.map(([, f]) => `<td>${f(p)}</td>`).join("")}</tr>`).join("");
  host.className = "detail";
  host.innerHTML = `<table><thead><tr>${cols.map(([h]) => `<th>${h}</th>`).join("")}</tr></thead>
                    <tbody>${rows}</tbody></table>`;
}

const pct = v => (v === null || v === undefined) ? "\u2014" : (100 * v).toFixed(0) + "%";
const escapeHtml = t => String(t).replace(/[&<>]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* ------------------------------------------------------------- interaction */
// The selected ply lives in the URL hash so that the snapshot mode's periodic
// full-page reload does not throw away where you were looking.
function select(index) {
  if (!state) return;
  const total = state.moves.length;
  if (index === null || index >= total - 1) {
    selected = null;
    location.hash = "";
  } else {
    selected = Math.max(0, Math.min(index, total - 1));
    location.hash = "ply" + (selected + 1);
  }
  paint();
}

function restoreFromHash(s) {
  const m = /^#ply(\d+)$/.exec(location.hash);
  if (!m) return;
  const index = parseInt(m[1], 10) - 1;
  if (index >= 0 && index < s.moves.length - 1) selected = index;
}

function paint() {
  if (!state) return;
  drawBoard(state); drawMoves(state); drawDetail(state); drawSummary(state);
}

document.getElementById("first").onclick = () => select(0);
document.getElementById("prev").onclick = () => select(at(state) - 1);
document.getElementById("next").onclick = () => select(at(state) + 1);
document.getElementById("last").onclick = () => select(null);
document.getElementById("golive").onclick = () => select(null);
document.getElementById("scrub").oninput = e => select(parseInt(e.target.value, 10));
document.addEventListener("keydown", e => {
  if (!state || !state.moves.length) return;
  if (e.key === "ArrowLeft") { select(at(state) - 1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { select(at(state) + 1); e.preventDefault(); }
  else if (e.key === "Home") { select(0); e.preventDefault(); }
  else if (e.key === "End" || e.key === "Escape") { select(null); e.preventDefault(); }
});

/* ---------------------------------------------------------------- top level */
function render(s) {
  const first = state === null;
  state = s;
  if (first) restoreFromHash(s);
  const p = s.players || {};
  document.getElementById("players").textContent = p.black
    ? `Game ${s.game_no} \u00b7 black \u2715 ${p.black.name}  vs  white \u25cb ${p.white.name}`
    : "";
  const st = document.getElementById("status");
  const done = s.status !== "in_progress" && s.status !== "waiting";
  st.textContent = done
    ? `${s.status}${s.reason ? " (" + s.reason + ")" : ""}` +
      `${s.winner ? " \u00b7 winner " + s.winner : ""}`
    : (s.thinking ? `${s.thinking.player} is thinking\u2026` : "in progress");
  st.className = done ? "tag ok" : "think";
  paint();
}

async function poll() {
  try {
    const r = await fetch("state.json", { cache: "no-store" });
    const s = await r.json();
    document.getElementById("conn").textContent = "";
    if (s.version !== version) { version = s.version; render(s); }
  } catch (e) {
    document.getElementById("conn").textContent = "\u00b7 disconnected (the game may have ended)";
  }
}
if (EMBEDDED) {
  render(EMBEDDED);
  document.getElementById("conn").textContent = "\u00b7 file snapshot (reloads itself)";
} else {
  poll();
  setInterval(poll, 600);
}
</script>
</body>
</html>
