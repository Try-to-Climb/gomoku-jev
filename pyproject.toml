[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gomoku-jev"
version = "0.1.0"
description = "A gomoku referee that benchmarks decision engines and LLMs, with jev (TypeSafe System One) as one of the players"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Try-to-Climb" }]
keywords = ["gomoku", "five-in-a-row", "llm", "benchmark", "evaluation", "jev", "typesafe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The engine, the rules, the referee, the scoring and the live view are pure
# standard library. `requests` is here because the jev backend is the headline
# feature; nothing else in the package imports it.
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# the second seat: any OpenAI-compatible endpoint
openai = ["openai>=1.40"]
all = ["gomoku-jev[openai]"]

[project.urls]
Homepage = "https://github.com/Try-to-Climb/gomoku-jev"
Source = "https://github.com/Try-to-Climb/gomoku-jev"
Issues = "https://github.com/Try-to-Climb/gomoku-jev/issues"

[project.scripts]
gomoku = "gomoku.cli:main"

[tool.setuptools.packages.find]
include = ["gomoku*"]
# results/ and docs/ are repository data, not runtime data
exclude = ["gomoku.tests*"]

[tool.setuptools.package-data]
# prompts.py and live.py read these from beside the module, so they must ship
gomoku = ["templates/**/*.txt", "templates/**/*.md", "live.html"]
